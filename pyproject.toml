[project]
name = "deep-person"
version = "0.1.0"
description = "Person re-identification component for Vbot framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "VitaDynamics", email = "info@vitadynamics.org"}
]
keywords = ["person-reid", "deep-learning", "computer-vision", "yolo", "resnet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.64.0",
    "gdown>=5.0.0",
    "ultralytics>=8.3.224",
    "tf-keras>=2.18.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
]

[project.optional-dependencies]
# GPU acceleration (optional)
faiss-gpu = [
    "faiss-gpu-cu12>=1.12.0",
]

# CPU fallback
faiss-cpu = [
    "faiss-cpu>=1.12.0",
]

# FastAPI service dependencies
api-service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

# Full dependencies (all optional features)
all = [
    "faiss-gpu-cu12>=1.12.0",
    "ultralytics>=8.3.224",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
