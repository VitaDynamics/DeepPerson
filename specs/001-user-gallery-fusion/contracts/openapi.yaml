# OpenAPI Contract: User Gallery Fusion Retrieval

openapi: 3.1.0
info:
  title: DeepPerson User Gallery Fusion API
  version: 1.0.0
  description: |
    API for user gallery fusion retrieval functionality.
    Extends existing DeepPerson capabilities with multi-modal (face + body) person re-identification.

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /galleries:
    post:
      summary: Create a new user gallery
      description: Register a new user with associated images and metadata
      tags:
        - galleries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGalleryRequest'
      responses:
        '201':
          description: Gallery created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGalleryResponse'
        '400':
          description: Invalid request data
        '409':
          description: User ID already exists

  /galleries/{user_id}:
    get:
      summary: Get user gallery details
      description: Retrieve detailed information about a specific user gallery
      tags:
        - galleries
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Gallery details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGalleryResponse'
        '404':
          description: Gallery not found

    put:
      summary: Update user gallery
      description: Update user gallery metadata and images
      tags:
        - galleries
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGalleryUpdateRequest'
      responses:
        '200':
          description: Gallery updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGalleryResponse'
        '404':
          description: Gallery not found

    delete:
      summary: Delete user gallery
      description: Remove a user gallery and all associated data
      tags:
        - galleries
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Gallery deleted successfully
        '404':
          description: Gallery not found

  /galleries/{user_id}/represent:
    post:
      summary: Generate embeddings for user gallery
      description: Generate body and optional face embeddings for all images in a user gallery
      tags:
        - embeddings
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepresentRequest'
      responses:
        '200':
          description: Embeddings generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentResponse'
        '404':
          description: Gallery not found

  /retrieve:
    post:
      summary: Perform user gallery retrieval
      description: Retrieve users from a single probe image using fusion scoring
      tags:
        - retrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
      responses:
        '200':
          description: Retrieval completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'
        '400':
          description: Invalid probe image or parameters

  /galleries/{user_id}/images:
    post:
      summary: Add images to user gallery
      description: Add new images to an existing user gallery
      tags:
        - galleries
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddImagesRequest'
      responses:
        '200':
          description: Images added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGalleryResponse'
        '404':
          description: Gallery not found

components:
  schemas:
    UserGalleryRequest:
      type: object
      required:
        - user_id
        - images
      properties:
        user_id:
          type: string
          description: Unique user identifier
          example: "user_12345"
        name:
          type: string
          description: User display name
          example: "John Doe"
        metadata:
          type: object
          description: Additional user metadata
          additionalProperties: true
          example:
            department: "Security"
            clearance: "Level 2"
        images:
          type: array
          description: List of images to add to the gallery
          minItems: 1
          items:
            $ref: '#/components/schemas/ImageAssetRequest'

    UserGalleryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: User display name
        metadata:
          type: object
          description: Additional user metadata
          additionalProperties: true
        images:
          type: array
          description: Images to add or update
          items:
            $ref: '#/components/schemas/ImageAssetRequest'

    UserGalleryResponse:
      type: object
      properties:
        user_id:
          type: string
          description: Unique user identifier
        name:
          type: string
          description: User display name
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PENDING_VERIFICATION]
          description: Gallery status
        created_at:
          type: string
          format: date-time
          description: Gallery creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last modification timestamp
        cluster_count:
          type: integer
          description: Number of variant clusters
        image_count:
          type: integer
          description: Total number of images
        embedding_count:
          type: integer
          description: Number of successfully generated embeddings
        metadata:
          type: object
          description: Additional user metadata
          additionalProperties: true

    ImageAssetRequest:
      type: object
      required:
        - image_path
      properties:
        image_path:
          type: string
          description: File system path or URL to image
          example: "/images/user_12345/face_001.jpg"
        modality:
          type: string
          enum: [BODY, FACE, UNKNOWN]
          default: UNKNOWN
          description: Image modality type
        cluster_id:
          type: string
          description: Optional cluster identifier
          example: "cluster_summer_2024"
        source_camera:
          type: string
          description: Camera identifier or source description
          example: "camera_01"
        capture_time:
          type: string
          format: date-time
          description: Image capture timestamp
        metadata:
          type: object
          description: Additional image metadata
          additionalProperties: true

    RepresentRequest:
      type: object
      properties:
        generate_face_embeddings:
          type: boolean
          default: false
          description: Flag to enable face embedding generation
        force_regenerate:
          type: boolean
          default: false
          description: Force regeneration of existing embeddings
        batch_size:
          type: integer
          default: 32
          description: Batch size for embedding generation

    RepresentResponse:
      type: object
      properties:
        user_id:
          type: string
          description: Target user identifier
        processed_images:
          type: integer
          description: Number of images processed
        generated_embeddings:
          type: integer
          description: Number of embeddings generated
        face_embeddings_generated:
          type: integer
          description: Number of face embeddings generated
        processing_time:
          type: number
          description: Total processing time in milliseconds
        errors:
          type: array
          description: List of processing errors
          items:
            type: object
            properties:
              image_id:
                type: string
                description: Image identifier
              error_message:
                type: string
                description: Error description

    RetrieveRequest:
      type: object
      required:
        - probe_image
      properties:
        probe_image:
          type: string
          description: Path to probe image for retrieval
          example: "/probes/probe_001.jpg"
        top_k:
          type: integer
          default: 10
          description: Number of results to return
        min_score:
          type: number
          default: 0.0
          description: Minimum score threshold (0.0-1.0)
        include_evidence:
          type: boolean
          default: true
          description: Include evidence images in response
        fusion_weights:
          $ref: '#/components/schemas/FusionWeights'

    FusionWeights:
      type: object
      properties:
        face_weight:
          type: number
          default: 0.5
          description: Weight for face modality (0.0-1.0)
        body_weight:
          type: number
          default: 0.5
          description: Weight for body modality (0.0-1.0)
      required:
        - face_weight
        - body_weight

    RetrieveResponse:
      type: object
      properties:
        probe_id:
          type: string
          description: Unique probe identifier
        results:
          type: array
          description: List of retrieval results
          items:
            $ref: '#/components/schemas/RetrievalResult'
        processing_time:
          type: number
          description: Total processing time in milliseconds
        fusion_weights:
          $ref: '#/components/schemas/FusionWeights'

    RetrievalResult:
      type: object
      properties:
        user_id:
          type: string
          description: Matched user identifier
        overall_score:
          type: number
          description: Final fusion score (0.0-1.0)
        face_score:
          type: number
          description: Face modality score contribution (0.0-1.0)
        body_score:
          type: number
          description: Body modality score contribution (0.0-1.0)
        face_weight:
          type: number
          description: Weight applied to face score (0.0-1.0)
        body_weight:
          type: number
          description: Weight applied to body score (0.0-1.0)
        evidence_images:
          type: array
          description: Image IDs contributing to the match
          items:
            type: string
        confidence_level:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: Confidence level of the match
        retrieved_at:
          type: string
          format: date-time
          description: Result generation timestamp

    AddImagesRequest:
      type: object
      required:
        - images
      properties:
        images:
          type: array
          description: List of images to add
          minItems: 1
          items:
            $ref: '#/components/schemas/ImageAssetRequest'
        auto_cluster:
          type: boolean
          default: true
          description: Automatically cluster images into variants

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true

  parameters:
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: Unique user identifier

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: galleries
    description: User gallery management operations
  - name: embeddings
    description: Embedding generation and management
  - name: retrieval
    description: User retrieval and search operations